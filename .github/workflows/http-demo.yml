name: HTTP interoperability demo
on:
  pull_request:
    paths:
      - 'guardian/go/**'
      - 'sdk/python/**'
      - '.github/workflows/http-demo.yml'
  push:
    paths:
      - 'guardian/go/**'
      - 'sdk/python/**'
      - '.github/workflows/http-demo.yml'
jobs:
  localhost-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK
        run: python -m pip install -e './sdk/python[test]'
      - name: Go tests
        working-directory: guardian/go
        run: go test -race ./...
      - name: Python to Go localhost HTTP demo
        run: python sdk/python/http_demo.py
