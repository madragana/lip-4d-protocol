name: Python SDK
on:
  push:
    paths: ['sdk/python/**','.github/workflows/python-sdk.yml']
  pull_request:
    paths: ['sdk/python/**','.github/workflows/python-sdk.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e './sdk/python[test]'
      - name: Test
        run: python -m pytest -q sdk/python/tests
